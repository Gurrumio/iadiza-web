<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- Fondo Oscuro Antracita Mate -->
  <rect width="800" height="800" fill="#202328"/>
  
  <g fill="#7FD3BD">
    <!-- Punto y coma ';' escalado a la MISMA altura que la 'D' (260px total de alto, Y=270 a Y=530) -->
    
    <!-- Punto superior del ';' -->
    <circle cx="240" cy="320" r="45" />
    
    <!-- Coma inferior del ';' -->
    <path d="M 240 390 C 270 390, 285 410, 285 435 C 285 475, 220 515, 185 530 L 165 500 C 195 480, 230 450, 230 430 C 230 410, 210 390, 240 390 Z" />
    
    <!-- Letra 'D' (Misma altura: Y=270 a Y=530, 260px total) -->
    <path d="M 370 270 L 480 270 C 560 270, 600 320, 600 400 C 600 480, 560 530, 480 530 L 370 530 Z M 420 320 L 420 480 L 475 480 C 520 480, 550 450, 550 400 C 550 350, 520 320, 475 320 Z" />
  </g>
</svg>
